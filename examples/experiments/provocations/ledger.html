<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lending Shed — loan slip</title>
<!--
  Experiment: creative mode from zero, no reference image (inspire, format 3 · provocations).
  Brief: INVENTED and neutral — a community tool library ("The Lending Shed"). All content is made up.
  Premise (from outside web design): the paper LOAN SLIP a librarian stamps — the page is the form.
  Principles taken: a form everybody already knows how to use; two-colour carbon print; a rubber stamp as the reward.
  DECISION: system monospace; blue carbon ink #1f3fd6 on cream #f4efe1, stamp in red #c8102e.
  DECISION: the form sends nothing; "approval" is computed in the page. Declared in the footer.
  First-visit cue: numbered fields 1-3 and the sentence "Fill in the three lines."
-->
<style>
:root{--ink:#1f3fd6;--paper:#f4efe1;--red:#c8102e}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1.05rem/1.5 ui-monospace,Menlo,Consolas,"Courier New",monospace}
:focus-visible{outline:4px solid var(--red);outline-offset:3px}
main{max-width:46rem;margin:0 auto;padding:1.5rem 1rem 3rem}
h1{margin:0;font:900 clamp(1.9rem,7vw,3.6rem)/1 "Arial Black",Impact,sans-serif;text-transform:uppercase;letter-spacing:-.02em}
.no{display:flex;justify-content:space-between;border-top:4px solid var(--ink);border-bottom:1px solid var(--ink);margin-top:.75rem;padding:.3rem 0;font-weight:700}
.lede{font-size:1.25rem;font-weight:700;margin:1rem 0}
form{overflow:hidden;border:3px solid var(--ink);padding:1rem;position:relative;background:repeating-linear-gradient(0deg,transparent 0 31px,rgba(31,63,214,.15) 31px 32px)}
.row{display:grid;grid-template-columns:2.25rem 1fr;gap:.25rem .75rem;margin:0 0 1.1rem;align-items:start}
.row .num{font:900 1.6rem/1 "Arial Black",Impact,sans-serif}
label{display:block;font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:.9rem}
input,select{width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:3px solid var(--ink);padding:.35rem .1rem;border-radius:0}
select{appearance:none;background:transparent}
input::placeholder{color:rgba(31,63,214,.55)}
.hint{font-size:.85rem;margin:.15rem 0 0}
.slip{margin-top:1.25rem;padding-top:1rem;border-top:3px dashed var(--ink);min-height:8.5rem;position:relative}
.slip p{margin:.2rem 0}
.slip .big{font:900 1.4rem "Arial Black",Impact,sans-serif;text-transform:uppercase}
.stamp{position:absolute;right:.5rem;top:.75rem;border:5px solid var(--red);color:var(--red);font:900 1.6rem "Arial Black",Impact,sans-serif;text-transform:uppercase;padding:.15rem .6rem;transform:rotate(-9deg);opacity:0;pointer-events:none;letter-spacing:.06em}
.stamp.on{opacity:.92}
@media (prefers-reduced-motion:no-preference){.stamp{transition:opacity 0s,transform .14s cubic-bezier(.2,1.6,.4,1)}.stamp:not(.on){transform:rotate(-9deg) scale(1.8)}}
footer{margin-top:1.5rem;font-size:.85rem}
</style>
</head>
<body>
<main>
  <h1>Loan slip</h1>
  <div class="no"><span>The Lending Shed</span><span>No. <span id="no">0417</span></span></div>
  <p class="lede">Want to borrow something? Fill in the three lines. The slip stamps itself.</p>
  <form id="f" autocomplete="off" onsubmit="return false">
    <div class="row"><span class="num" aria-hidden="true">1</span>
      <div><label for="who">Your name</label><input id="who" placeholder="e.g. Sam Okafor"></div></div>
    <div class="row"><span class="num" aria-hidden="true">2</span>
      <div><label for="tool">Which tool</label>
        <select id="tool"><option value="">— choose —</option>
          <option value="7|Claw hammer">Claw hammer</option><option value="7|Adjustable wrench">Adjustable wrench</option>
          <option value="3|Cordless drill">Cordless drill</option><option value="7|Tape measure">Tape measure</option>
          <option value="2|Step ladder">Step ladder</option><option value="7|Spirit level">Spirit level</option></select></div></div>
    <div class="row"><span class="num" aria-hidden="true">3</span>
      <div><label for="days">How many days</label><input id="days" type="number" inputmode="numeric" min="1" max="7" value="2">
      <p class="hint" id="limit">Choose a tool to see how long you may keep it.</p></div></div>
    <div class="slip" aria-live="polite">
      <div class="stamp" id="stamp">Approved</div>
      <p id="out">Your slip appears here.</p>
    </div>
  </form>
  <footer>Invented brief for a design experiment. Nothing here is real and nothing is sent anywhere.</footer>
</main>
<script>
const $ = id => document.getElementById(id);
const who=$('who'), tool=$('tool'), days=$('days'), out=$('out'), stamp=$('stamp'), limit=$('limit');
$('no').textContent = String(400 + Math.floor(Math.random()*500)).padStart(4,'0');
const fmt = d => d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
function update(){
  const [max,name] = tool.value ? tool.value.split('|') : [null,null];
  if(max){ days.max = max; limit.textContent = name + ': keep it up to ' + max + ' days.'; if(+days.value > +max) days.value = max; }
  const n = +days.value, ok = who.value.trim() && max && n >= 1 && n <= +max;
  if(ok){
    const back = new Date(); back.setDate(back.getDate() + n);
    out.innerHTML = '<span class="big">' + name + '</span><br>Borrower: ' + who.value.trim().replace(/[<>&]/g,'') + '<br>Bring it back by <strong>' + fmt(back) + '</strong>.';
  } else {
    const miss = []; if(!who.value.trim()) miss.push('your name'); if(!max) miss.push('a tool');
    out.textContent = miss.length ? 'Still needed: ' + miss.join(' and ') + '.' : 'Days must be 1 to ' + max + '.';
  }
  stamp.classList.toggle('on', !!ok);
}
['input','change'].forEach(e => { who.addEventListener(e,update); tool.addEventListener(e,update); days.addEventListener(e,update); });
</script>
</body>
</html>
