<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Machine — original reference C</title>
<!-- Original reference made for this repository (fictional studio). Apache-2.0 with the repo.
     Rendered to ../ref-c-soft-machine.png at 1440×900, DPR 1. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f4f1ea;--ink:#111;--blue:#2438ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:15px/1.4 "Inter Tight",Arial,sans-serif;height:100vh;overflow:hidden;display:grid;grid-template-columns:1fr 380px}
  .words{padding:26px 32px;display:flex;flex-direction:column;justify-content:center}
  .words p{margin:0;font:400 128px/.9 "Archivo Black",Impact,sans-serif;text-transform:uppercase;letter-spacing:-.03em}
  .words .o{color:transparent;-webkit-text-stroke:2px var(--ink)}
  .words .s{margin-left:1.2em}
  .words small{font:500 13px/1.3 "Inter Tight",sans-serif;text-transform:uppercase;letter-spacing:.12em;margin-top:28px}
  aside{background:var(--blue);color:#fff;padding:26px 26px 22px;display:grid;grid-template-rows:auto 1fr auto}
  aside nav{display:flex;flex-direction:column;gap:2px;font-size:22px;font-weight:500}
  aside nav a{color:inherit;text-decoration:none;border-bottom:1.5px solid #fff;padding:6px 0;display:flex;justify-content:space-between}
  .dots{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;align-content:center;padding:30px 0}
  .dots i{aspect-ratio:1;border-radius:50%;border:2px solid #fff}
  .dots i.f{background:#fff}
  aside footer{font-size:12px;text-transform:uppercase;letter-spacing:.1em;display:flex;justify-content:space-between}
</style>
</head>
<body>
<section class="words">
  <p>We make</p>
  <p class="o s">tools</p>
  <p>for</p>
  <p class="o">strange</p>
  <p class="s">ideas</p>
  <small>Soft Machine — a small studio for software nobody asked for · est. 2019</small>
</section>
<aside>
  <nav><a href="#">Work <span>↗</span></a><a href="#">Tools <span>↗</span></a><a href="#">Notes <span>↗</span></a><a href="#">Contact <span>↗</span></a></nav>
  <div class="dots" aria-hidden="true">
    <i class="f"></i><i></i><i></i><i class="f"></i><i></i><i></i>
    <i></i><i class="f"></i><i></i><i></i><i></i><i class="f"></i>
    <i></i><i></i><i class="f"></i><i></i><i class="f"></i><i></i>
    <i class="f"></i><i></i><i></i><i></i><i></i><i class="f"></i>
  </div>
  <footer><span>Open for 2 projects</span><span>2026</span></footer>
</aside>
</body>
</html>
